function classifyCat(cat, name) {
  if (name.includes("Freihof") && !cat.includes("Getränk")) return "Freihof";
  const c = cat.toLowerCase();
  if (c.includes("craft beer bar") || c.includes("bierspezialität")) return "Craft Beer Bar";
  if (c.includes("brauerei-bar") || c.includes("brauerei-restaurant") || c.includes("brewpub")) return "Brauerei-Bar";
  if (c.includes("pop-up") || c.includes("popup") || c.includes("catering")) return "Pop-up / Event";
  if (c.includes("eventlocation") || c.includes("eventveranstalter") || c.includes("messe")) return "Eventlocation";
  if (c.includes("hotel")) return "Hotel";
  if (c.includes("restaurant") || c.includes("restaurantkette")) return "Restaurant";
  if (c.includes("getränk") || c.includes("craft beer handel") || c.includes("craft beer grosshandel")) return "Getränkehandel";
  if (c.includes("detailhandel") || c.includes("cash & carry")) return "Detailhandel";
  if (c.includes("brauerei") || c.includes("grossbrauerei") || c.includes("mikrobrauerei") || c.includes("traditionsbrauerei") || c.includes("craft-grossbrauerei") || c.includes("craft-brauerei") || c.includes("mittelgrosse")) return "Brauerei";
  if (c.includes("online") || c.includes("plattform")) return "Online / Plattform";
  return "Sonstiges";
}

function statusClass(s){
  if(!s)return"status-offen";
  const l=s.toLowerCase();
  if(l.includes("verhandlung")||l.includes("prüfung"))return"status-verhandlung";
  if(l.includes("bestandskunde")||l.includes("aktiv"))return"status-bestandskunde";
  if(l.includes("gelistet"))return"status-gelistet";
  return"status-offen";
}

function makeIcon(catKey){
  const c=categories[catKey]||categories["Sonstiges"];
  const size=catKey==="Freihof"?20:12;
  const border=catKey==="Freihof"?"3px solid #1B4332":"2px solid rgba(0,0,0,.3)";
  const shadow=catKey==="Freihof"?`box-shadow:0 0 16px ${c.color}80`:`box-shadow:0 0 6px ${c.color}60`;
  return L.divIcon({
    className:'',
    html:`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${c.color};border:${border};${shadow}"></div>`,
    iconSize:[size,size],iconAnchor:[size/2,size/2]
  });
}

const layers={};
const markers=[];

pois.forEach(p=>{
  const catKey=classifyCat(p.cat,p.n);
  const c=categories[catKey]||categories["Sonstiges"];
  let popup=`<div class="popup-name">${c.icon} ${p.n}</div>`;
  popup+=`<div class="popup-cat">${p.cat}</div>`;
  popup+=`<div class="popup-row"><span class="popup-label">Ort:</span>${p.ort}${p.km?' · '+p.km+' km ab Gossau':''}</div>`;
  if(p.kontakt)popup+=`<div class="popup-row"><span class="popup-label">Kontakt:</span>${p.kontakt}</div>`;
  if(p.tel)popup+=`<div class="popup-row"><span class="popup-label">Telefon:</span><a class="popup-link" href="tel:${p.tel}">${p.tel}</a></div>`;
  if(p.email)popup+=`<div class="popup-row"><span class="popup-label">E-Mail:</span><a class="popup-link" href="mailto:${p.email}">${p.email}</a></div>`;
  if(p.web)popup+=`<div class="popup-row"><span class="popup-label">Web:</span><a class="popup-link" href="${p.web}" target="_blank">${p.web.replace('https://','').replace('http://','').split('/')[0]}</a></div>`;
  if(p.status)popup+=`<div class="popup-row"><span class="popup-label">Status:</span><span class="popup-status ${statusClass(p.status)}">${p.status}</span></div>`;
  if(p.prio)popup+=`<div class="popup-row"><span class="popup-label">Priorität:</span>${p.prio}</div>`;
  if(p.notizen)popup+=`<div class="popup-row" style="margin-top:6px;color:#666;font-size:11px;font-style:italic">${p.notizen}</div>`;

  const m=L.marker([p.lat,p.lng],{icon:makeIcon(catKey)}).bindPopup(popup,{maxWidth:320});
  m._catKey=catKey;
  markers.push(m);
  if(!layers[catKey])layers[catKey]=[];
  layers[catKey].push(m);
  m.addTo(map);
});

const catOrder=["Freihof","Craft Beer Bar","Brauerei-Bar","Restaurant","Restaurantkette","Pop-up / Event","Eventlocation","Eventveranstalter","Hotel","Getränkehandel","Detailhandel","Brauerei","Online / Plattform","Sonstiges"];
const activeCats=new Set(usedCats);
catOrder.forEach(ck=>{
  if(!usedCats.includes(ck))return;
  const c=categories[ck];
  const count=(layers[ck]||[]).length;
  const div=document.createElement('div');
  div.className='legend-item';
  div.innerHTML=`<span class="dot" style="background:${c.color}"></span>${c.icon} ${ck} (${count})`;
  div.onclick=()=>{
    if(activeCats.has(ck)){activeCats.delete(ck);div.classList.add('dimmed')}
    else{activeCats.add(ck);div.classList.remove('dimmed')}
    markers.forEach(m=>{
      if(activeCats.has(m._catKey))m.addTo(map);
      else map.removeLayer(m);
    });
    updateCount();
  };
  legendEl.appendChild(div);
});

function updateCount(){
  const vis=markers.filter(m=>activeCats.has(m._catKey)).length;
  document.getElementById('count-display').textContent=vis+' Standorte angezeigt';
}
updateCount();

// Freihof radius circles
L.circle(FREIHOF,{radius:15000,color:'#40C057',fillColor:'#40C057',fillOpacity:.05,weight:1,dashArray:'4 6'}).addTo(map).bindPopup('15 km Radius');
L.circle(FREIHOF,{radius:30000,color:'#2D6A4F',fillColor:'#2D6A4F',fillOpacity:.03,weight:1,dashArray:'4 6'}).addTo(map).bindPopup('30 km Radius');
</script>
